name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format migrated source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bunx prettier --write "src/**/*.{ts,tsx}" "vite.config.ts"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src vite.config.ts
            git commit -m "style: normalize source formatting after migration"
            git push
          fi

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
